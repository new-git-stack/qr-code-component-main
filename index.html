<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>

  <style>
    .attribution { 
      font-size: 0.6875rem; 
      text-align: center; 
      position: fixed;
      bottom: 5vh;
    }
    .attribution a { 
      color: hsl(228, 45%, 44%); 
    }
    .attribution a:hover {
      color: red;
    }

    body {
      background-color: hsl(212, 45%, 89%);
      font-family: Outfit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      min-height: 100vh;
    }

    p {
      margin: 0;
    }

    .qr-div {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: white;
      width: 300px;
      height: 470px;
      padding: 20px ;
      border-radius: 3%;
    }

    #qr-code-image {
      width: 100%;
      border-radius: 3%;
    }

    .info {
      width: 95%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tagline {
      font-weight: 700;
      text-align: center;
      color: hsl(218, 44%, 22%);
    }

    .call-to-action {
      text-align: center;
      font-size: 15px;
      font-weight: 400;
      color:hsl(216, 15%, 48%);
    }
  </style>
</head>
<body>

  <div class="qr-div">
    <img src="images/image-qr-code.png" alt="" id="qr-code-image">
    <div class="info">
      <h2 class="tagline">
        Improve your front-end <br> skills by building projects
      </h2>
      <p class="call-to-action">
        Scan the QR code to visit Frontend <br> Mentor and take your coding skills to <br> the next level
      </p>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/new-git-stack">Obeten Samuel</a>.
  </footer>
</body>
</html>
